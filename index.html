<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020817" />
    <title>Cadê Meu Barco — Sistema de Navegação</title>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#020817}
      #cmb-preload{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center}
      #cmb-preload img{width:112px;height:112px;border-radius:30px;object-fit:cover;box-shadow:0 24px 70px rgba(14,165,233,.22);animation:cmbPulse 2.2s ease-in-out infinite}
      #cmb-preload small{display:block;margin-top:18px;color:#7dd3fc;font-weight:900;letter-spacing:.22em;text-transform:uppercase}
      #cmb-preload strong{display:block;max-width:380px;margin:9px auto 0;font-size:22px;line-height:1.2}
      #cmb-preload .track{width:min(310px,75vw);height:8px;margin:24px auto 0;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.1)}
      #cmb-preload .bar{display:block;width:65%;height:100%;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#67e8f9,#facc15);animation:cmbLoad 1.45s ease-in-out infinite}
      @keyframes cmbPulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.025)}}
      @keyframes cmbLoad{0%{transform:translateX(-105%)}55%{transform:translateX(-15%)}100%{transform:translateX(105%)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cmb-preload">
        <div>
          <img src="/icone-oficial-cade-meu-barco.png" alt="Cadê Meu Barco" />
          <small>Cadê Meu Barco</small>
          <strong>A navegação da Amazônia mais conectada.</strong>
          <div class="track"><span class="bar"></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
