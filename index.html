<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icone-oficial-cade-meu-barco.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020817" />
    <title>Cadê Meu Barco</title>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#020817}
      .cmb-loader{min-height:100vh;display:grid;place-items:center;color:#e0f2fe;font-family:system-ui,sans-serif}
      .cmb-loader-box{text-align:center}.cmb-boat{width:96px;height:96px;border-radius:24px;object-fit:cover;animation:cmb-float 1.2s ease-in-out infinite}
      .cmb-line{width:180px;height:4px;margin:12px auto;border-radius:99px;background:#0ea5e9;overflow:hidden}
      .cmb-line:after{content:"";display:block;width:55px;height:100%;background:#facc15;animation:cmb-load 1.1s linear infinite}
      .cmb-title{font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
      @keyframes cmb-float{50%{transform:translateY(-5px)}}@keyframes cmb-load{from{transform:translateX(-60px)}to{transform:translateX(190px)}}
    </style>
  </head>
  <body>
    <div id="root"><div class="cmb-loader"><div class="cmb-loader-box"><img class="cmb-boat" src="/icone-oficial-cade-meu-barco.png" alt="Cadê Meu Barco"><div class="cmb-line"></div><div class="cmb-title">Cadê Meu Barco</div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
